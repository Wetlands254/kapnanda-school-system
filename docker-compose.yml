services:
  kapnanda:
    build: .
    container_name: kapnanda-school
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      DB_PATH: /app/data/kapnanda.db
    volumes:
      - kapnanda_data:/app/data
volumes:
  kapnanda_data:
