<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapnanda Primary & Junior School Management System</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--primary:#2563eb;--secondary:#0f766e;--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#64748b;--danger:#dc2626;--success:#16a34a;--border:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--primary);color:white}.secondary{background:#64748b}.success{background:var(--success)}.danger{background:var(--danger)}.light{background:#eaf1ff;color:#1746a2}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#102a43;color:#fff;padding:18px;position:fixed;left:0;top:0;bottom:0;overflow:auto}.brand{font-size:20px;font-weight:800;padding:10px 4px 20px;line-height:1.2}.brand small{display:block;font-size:12px;font-weight:400;color:#b9c9d8;margin-top:5px}.nav button{width:100%;text-align:left;background:transparent;margin:3px 0;color:#dce7f2}.nav button:hover,.nav button.active{background:#1f4b73}.main{margin-left:250px;width:calc(100% - 250px);padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:25px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 3px 12px #0f172a0b;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat h3{margin:0;color:var(--muted);font-size:13px}.stat .num{font-size:28px;font-weight:800;margin-top:8px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{margin:0;font-size:19px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:white}.field textarea{min-height:80px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{background:#f8fafc;font-size:12px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e0ecff;color:#1d4ed8;font-weight:700;font-size:12px}.hidden{display:none!important}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.chartbox{height:300px}.print-only{display:none}.report{background:white;padding:28px;border:1px solid #ddd}.schoolhead{text-align:center;border-bottom:3px solid #2563eb;padding-bottom:12px;margin-bottom:16px}.schoolhead h1{margin:0}.schoolhead p{margin:4px}.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}.report table{width:100%;border-collapse:collapse;margin-top:15px}.report th,.report td{border:1px solid #bbb;padding:7px}.recommend{background:#f1f7ff;border-left:5px solid #2563eb;padding:12px;margin-top:15px}.small{font-size:12px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modalbox{background:#fff;border-radius:14px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:20px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:12px 16px;border-radius:8px;display:none;z-index:20}
@media(max-width:900px){.sidebar{width:210px}.main{margin-left:210px;width:calc(100% - 210px)}.grid{grid-template-columns:repeat(2,1fr)}.formgrid,.two{grid-template-columns:1fr}}
@media(max-width:650px){.sidebar{position:relative;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:1fr 1fr}.nav button{font-size:12px}}
@media print{body{background:white}.sidebar,.top,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.card{box-shadow:none;border:0}.print-only{display:block}.report{border:0}.pagebreak{page-break-before:always}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">KAPNANDA PRIMARY & JUNIOR SCHOOL<small>School Management System</small></div>
<div class="nav" id="nav"></div>
</aside>
<main class="main">
<div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="small">PP1 – Grade 9 • Term 3, 2026</div></div><div class="toolbar no-print"><button class="light" onclick="backup()">Backup Data</button><button onclick="window.print()">Print</button></div></div>
<div id="content"></div>
</main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalBody"></div></div>
<div id="toast" class="toast"></div>
<script>
const KEY="kapnanda_sms_v1";
const classes=["PP1","PP2","Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6","Grade 7","Grade 8","Grade 9"];
const primary=["PP1","PP2","Grade 1","Grade 2","Grade 3","Grade 4","Grade 5","Grade 6"];
const junior=["Grade 7","Grade 8","Grade 9"];
const subjects={
"PP1":["Language Activities","Mathematical Activities","Environmental Activities","Creative Activities"],
"PP2":["Language Activities","Mathematical Activities","Environmental Activities","Creative Activities"],
"Grade 1":["English","Kiswahili","Mathematics","Environmental Activities","Creative Arts","Religious Education"],
"Grade 2":["English","Kiswahili","Mathematics","Environmental Activities","Creative Arts","Religious Education"],
"Grade 3":["English","Kiswahili","Mathematics","Environmental Activities","Creative Arts","Religious Education"],
"Grade 4":["English","Kiswahili","Mathematics","Science & Technology","Agriculture","Social Studies","Creative Arts & Sports","Religious Education"],
"Grade 5":["English","Kiswahili","Mathematics","Science & Technology","Agriculture","Social Studies","Creative Arts & Sports","Religious Education"],
"Grade 6":["English","Kiswahili","Mathematics","Science & Technology","Agriculture","Social Studies","Creative Arts & Sports","Religious Education"],
"Grade 7":["English","Kiswahili","Mathematics","Integrated Science","Agriculture","Social Studies","Creative Arts & Sports","Pre-Technical Studies","Religious Education"],
"Grade 8":["English","Kiswahili","Mathematics","Integrated Science","Agriculture","Social Studies","Creative Arts & Sports","Pre-Technical Studies","Religious Education"],
"Grade 9":["English","Kiswahili","Mathematics","Integrated Science","Agriculture","Social Studies","Creative Arts & Sports","Pre-Technical Studies","Religious Education"]
};
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
settings:{school:"Kapnanda Primary & Junior School",term:"Term 3",year:"2026",fee:800,phone:"",email:""},
learners:[],teachers:[],payments:[],marks:[],exams:[{id:"EX1",name:"Term 3 Assessment 2026",term:"Term 3",year:"2026"}],
timetable:[],attendance:[]
};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function grade(m){m=Number(m);if(m>=41)return"EE1";if(m>=36)return"EE2";if(m>=31)return"ME1";if(m>=25)return"ME2";if(m>=21)return"AE1";if(m>=15)return"AE2";if(m>=6)return"BE1";return"BE2"}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function show(page){document.getElementById("pageTitle").textContent=page;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));window.scrollTo(0,0);({Dashboard:dashboard,Learners,Teachers,Exams,Marks,Rankings,Fees,Timetable,Attendance,Reports,Performance,Settings}[page]||dashboard)()}
const pages=["Dashboard","Learners","Teachers","Exams","Marks","Rankings","Fees","Timetable","Attendance","Reports","Performance","Settings"];
document.getElementById("nav").innerHTML=pages.map(p=>`<button data-page="${p}" onclick="show('${p}')">${({Dashboard:"🏠",Learners:"👨‍🎓",Teachers:"👩‍🏫",Exams:"📝",Marks:"✏️",Rankings:"🏆",Fees:"💰",Timetable:"📅",Attendance:"📋",Reports:"📄",Performance:"📊",Settings:"⚙️"}[p])} ${p}</button>`).join("");
function dashboard(){
let paid=db.payments.reduce((a,b)=>a+Number(b.amount||0),0), expected=db.learners.length*Number(db.settings.fee||0);
document.getElementById("content").innerHTML=`<div class="grid">
${stat("Learners",db.learners.length,"👨‍🎓")}${stat("Teachers",db.teachers.length,"👩‍🏫")}${stat("Fees Collected","KSh "+paid.toLocaleString(),"💰")}${stat("Outstanding","KSh "+Math.max(expected-paid,0).toLocaleString(),"📌")}
</div>
<div class="two"><div class="card"><div class="section-title"><h2>Learners by Class</h2></div><div class="chartbox"><canvas id="classChart"></canvas></div></div>
<div class="card"><div class="section-title"><h2>Fees</h2></div><div class="chartbox"><canvas id="feeChart"></canvas></div></div></div>
<div class="card"><div class="section-title"><h2>Quick Actions</h2></div><div class="toolbar">
<button onclick="show('Learners')">Add Learner</button><button onclick="show('Marks')">Enter Marks</button><button onclick="show('Fees')">Record Fees</button><button onclick="show('Timetable')">Generate Timetable</button><button onclick="show('Reports')">Generate Report</button><button onclick="show('Rankings')">View Rankings</button></div></div>`;
new Chart(document.getElementById("classChart"),{type:"bar",data:{labels:classes,datasets:[{label:"Learners",data:classes.map(c=>db.learners.filter(x=>x.class===c).length)}]},options:{responsive:true,maintainAspectRatio:false}});
new Chart(document.getElementById("feeChart"),{type:"doughnut",data:{labels:["Collected","Outstanding"],datasets:[{data:[paid,Math.max(expected-paid,0)]}]},options:{responsive:true,maintainAspectRatio:false}});
}
function stat(a,b,c){return `<div class="card stat"><h3>${c} ${a}</h3><div class="num">${b}</div></div>`}
function Learners(){
let rows=db.learners.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.adm)}</td><td>${esc(x.name)}</td><td>${esc(x.gender)}</td><td>${esc(x.class)}</td><td>${esc(x.parent)}</td><td><button class="light" onclick="editLearner('${x.id}')">Edit</button> <button class="danger" onclick="del('learners','${x.id}','learner')">Delete</button></td></tr>`).join("");
document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>Learner Register</h2><div class="toolbar"><input id="lsearch" placeholder="Search name/admission..." oninput="filterTable('learnerTable',this.value)"><button onclick="learnerForm()">+ Add Learner</button></div></div><div class="tablewrap"><table class="table" id="learnerTable"><thead><tr><th>#</th><th>Admission</th><th>Name</th><th>Gender</th><th>Class</th><th>Parent/Guardian</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan=7>No learners yet.</td></tr>'}</tbody></table></div></div>`;
}
function filterTable(id,q){document.querySelectorAll("#"+id+" tbody tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?"":"none")}
function learnerForm(id=null){
let x=db.learners.find(a=>a.id===id)||{adm:"",name:"",gender:"",class:"Grade 7",dob:"",parent:"",phone:"",address:""};
openModal(`<h2>${id?"Edit":"Add"} Learner</h2><div class="formgrid">
${field("Admission Number","adm",x.adm)}${field("Full Name","name",x.name)}${field("Gender","gender",x.gender,"select",["Male","Female"])}
${field("Class","class",x.class,"select",classes)}${field("Date of Birth","dob",x.dob,"date")}${field("Parent/Guardian","parent",x.parent)}
${field("Phone","phone",x.phone)}${field("Address","address",x.address)}<div></div></div><div class="toolbar"><button onclick="saveLearner('${id||""}')">Save</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`);
}
function field(label,name,value,type="text",opts=[]){return `<div class="field"><label>${label}</label>${type==="select"?`<select id="f_${name}">${opts.map(o=>`<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select>`:`<input id="f_${name}" type="${type}" value="${esc(value)}">`}</div>`}
function saveLearner(id){let x={id:id||uid("L"),...Object.fromEntries(["adm","name","gender","class","dob","parent","phone","address"].map(k=>[k,document.getElementById("f_"+k).value]))};let i=db.learners.findIndex(a=>a.id===x.id);if(i>=0)db.learners[i]=x;else db.learners.push(x);save();closeModal();Learners();toast("Learner saved")}
function editLearner(id){learnerForm(id)}
function del(table,id,label){if(confirm("Delete this "+label+"?")){db[table]=db[table].filter(x=>x.id!==id);save();show(document.getElementById("pageTitle").textContent);toast("Deleted")}}
function Teachers(){
let rows=db.teachers.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.staff)}</td><td>${esc(x.phone)}</td><td>${esc(x.subjects)}</td><td>${esc(x.classes)}</td><td><button class="danger" onclick="del('teachers','${x.id}','teacher')">Delete</button></td></tr>`).join("");
document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>Teacher Register</h2><button onclick="teacherForm()">+ Add Teacher</button></div><div class="tablewrap"><table class="table"><thead><tr><th>#</th><th>Name</th><th>Staff No.</th><th>Phone</th><th>Subjects</th><th>Classes</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=7>No teachers yet.</td></tr>'}</tbody></table></div></div>`;
}
function teacherForm(){openModal(`<h2>Add Teacher</h2><div class="formgrid">${field("Teacher name","name","")}${field("Staff number","staff","")}${field("Phone","phone","")}${field("Email","email","")}${field("Subjects (comma separated)","subjects","")}${field("Classes (comma separated)","classes","")}</div><div class="toolbar"><button onclick="saveTeacher()">Save</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`)}
function saveTeacher(){let x={id:uid("T"),name:v("name"),staff:v("staff"),phone:v("phone"),email:v("email"),subjects:v("subjects"),classes:v("classes")};db.teachers.push(x);save();closeModal();Teachers();toast("Teacher saved")}
function Exams(){
let rows=db.exams.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.term)}</td><td>${x.year}</td><td><button class="danger" onclick="del('exams','${x.id}','exam')">Delete</button></td></tr>`).join("");
document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>Examinations</h2><button onclick="examForm()">+ New Examination</button></div><table class="table"><thead><tr><th>Name</th><th>Term</th><th>Year</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function examForm(){openModal(`<h2>New Examination</h2><div class="formgrid">${field("Examination name","name","Term 3 Assessment 2026")}${field("Term","term",db.settings.term)}${field("Year","year",db.settings.year,"number")}</div><div class="toolbar"><button onclick="saveExam()">Save</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`)}
function saveExam(){db.exams.push({id:uid("EX"),name:v("name"),term:v("term"),year:v("year")});save();closeModal();Exams();toast("Examination created")}
function Marks(){
document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>Marks Entry</h2></div><div class="formgrid">${field("Examination","mex",db.exams[0]?.id||"","select",db.exams.map(x=>x.id))}${field("Class","mclass","Grade 7","select",classes)}${field("Subject","msub","English","select",subjects["Grade 7"])}</div><div class="toolbar"><button onclick="loadMarks()">Load Learners</button><button class="success" onclick="saveMarks()">Save Marks</button></div><div id="marktable" class="tablewrap" style="margin-top:15px"></div></div>`;
}
function loadMarks(){let c=v("mclass"),s=v("msub"),e=v("mex");let learners=db.learners.filter(x=>x.class===c);let rows=learners.map(x=>{let m=db.marks.find(z=>z.learner===x.id&&z.exam===e&&z.subject===s);return `<tr><td>${esc(x.adm)}</td><td>${esc(x.name)}</td><td><input class="markinput" data-id="${x.id}" value="${m?.mark??""}" type="number" min="0" max="50"></td><td class="g" data-for="${x.id}">${m?grade(m.mark):""}</td></tr>`}).join("");document.getElementById("marktable").innerHTML=`<table class="table"><thead><tr><th>Admission</th><th>Learner</th><th>Marks / 50</th><th>Grade</th></tr></thead><tbody>${rows||'<tr><td colspan=4>No learners in this class.</td></tr>'}</tbody></table>`;document.querySelectorAll(".markinput").forEach(i=>i.oninput=()=>document.querySelector('[data-for="'+i.dataset.id+'"]').textContent=i.value===""?"":grade(i.value))}
function saveMarks(){let e=v("mex"),c=v("mclass"),s=v("msub");document.querySelectorAll(".markinput").forEach(inp=>{let idx=db.marks.findIndex(m=>m.learner===inp.dataset.id&&m.exam===e&&m.subject===s);let val=inp.value;if(val===""){if(idx>=0)db.marks.splice(idx,1);return}let obj={id:idx>=0?db.marks[idx].id:uid("M"),learner:inp.dataset.id,exam:e,class:c,subject:s,mark:Number(val)};if(idx>=0)db.marks[idx]=obj;else db.marks.push(obj)});save();toast("Marks saved")}
function Rankings(){
document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>Subject & Overall Rankings</h2><button onclick="printRanking()">Print</button></div><div class="formgrid">${field("Examination","rex",db.exams[0]?.id||"","select",db.exams.map(x=>x.id))}${field("Class","rclass","Grade 7","select",classes)}${field("Subject","rsub","English","select",subjects["Grade 7"])}</div><button onclick="renderRanking()">Show Ranking</button><div id="rankout" style="margin-top:15px"></div></div>`}
function renderRanking(){let c=v("rclass"),s=v("rsub"),e=v("rex"),arr=db.marks.filter(m=>m.class===c&&m.subject===s&&m.exam===e).sort((a,b)=>b.mark-a.mark);let rows=arr.map((m,i)=>{let l=db.learners.find(x=>x.id===m.learner);return `<tr><td>${i+1}</td><td>${esc(l?.adm||"")}</td><td>${esc(l?.name||"")}</td><td>${m.mark}</td><td>${grade(m.mark)}</td></tr>`}).join("");document.getElementById("rankout").innerHTML=`<h3>${esc(s)} — ${esc(c)}</h3><table class="table"><thead><tr><th>Pos</th><th>Admission</th><th>Learner</th><th>Marks</th><th>Grade</th></tr></thead><tbody>${rows||'<tr><td colspan=5>No marks entered.</td></tr>'}</tbody></table>`}
function printRanking(){window.print()}
function Fees(){
let rows=db.learners.map(l=>{let paid=db.payments.filter(p=>p.learner===l.id).reduce((a,b)=>a+Number(b.amount),0),bal=Math.max(Number(db.settings.fee||0)-paid,0);return `<tr><td>${esc(l.adm)}</td><td>${esc(l.name)}</td><td>${esc(l.class)}</td><td>KSh ${paid.toLocaleString()}</td><td>KSh ${bal.toLocaleString()}</td><td><button onclick="paymentForm('${l.id}')">Record Payment</button></td></tr>`}).join("");
document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>Fees Management</h2><button onclick="feeStructure()">Print Fee Structure</button></div><p class="small">Default fee per learner: KSh ${Number(db.settings.fee).toLocaleString()}</p><div class="tablewrap"><table class="table"><thead><tr><th>Admission</th><th>Learner</th><th>Class</th><th>Paid</th><th>Balance</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=6>No learners yet.</td></tr>'}</tbody></table></div></div>`}
function paymentForm(id){let l=db.learners.find(x=>x.id===id);openModal(`<h2>Record Fee Payment</h2><p><b>${esc(l.name)}</b> — ${esc(l.class)}</p><div class="formgrid">${field("Amount","amount","","number")}${field("Payment method","method","M-Pesa","select",["M-Pesa","Cash","Bank","Other"])}${field("Receipt number","receipt",uid("R").toUpperCase())}</div><div class="toolbar"><button onclick="savePayment('${id}')">Save Payment</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`)}
function savePayment(id){db.payments.push({id:uid("P"),learner:id,amount:Number(v("amount")),method:v("method"),receipt:v("receipt"),date:new Date().toISOString().slice(0,10)});save();closeModal();Fees();toast("Payment recorded")}
function feeStructure(){let rows=classes.map(c=>`<tr><td>${c}</td><td>KSh ${Number(db.settings.fee).toLocaleString()}</td></tr>`).join("");openModal(`<div class="report" id="feePrint"><div class="schoolhead"><h1>${esc(db.settings.school)}</h1><p>FEE STRUCTURE — ${esc(db.settings.term)}, ${db.settings.year}</p></div><table><tr><th>Class</th><th>Term Fee</th></tr>${rows}</table></div><div class="toolbar no-print"><button onclick="window.print()">Print</button><button class="secondary" onclick="closeModal()">Close</button></div>`)}
function Timetable(){
let rows=db.timetable.map(x=>`<tr><td>${esc(x.day)}</td><td>${esc(x.time)}</td><td>${esc(x.class)}</td><td>${esc(x.subject)}</td><td>${esc(x.teacher)}</td></tr>`).join("");
document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>Timetable Generator</h2><button onclick="generateTimetable()">Generate Basic Timetable</button></div><p class="small">Add teachers and assignments first. The generator avoids assigning one teacher to two classes in the same slot and avoids duplicate class slots.</p><div class="tablewrap"><table class="table"><thead><tr><th>Day</th><th>Time</th><th>Class</th><th>Subject</th><th>Teacher</th></tr></thead><tbody>${rows||'<tr><td colspan=5>No timetable generated.</td></tr>'}</tbody></table></div></div>`}
function generateTimetable(){
if(!db.teachers.length){toast("Add teachers first");return}
const slots=[["Monday","08:00-08:40"],["Monday","08:40-09:20"],["Monday","09:20-10:00"],["Monday","10:20-11:00"],["Monday","11:00-11:40"],["Tuesday","08:00-08:40"],["Tuesday","08:40-09:20"],["Tuesday","09:20-10:00"],["Tuesday","10:20-11:00"],["Tuesday","11:00-11:40"],["Wednesday","08:00-08:40"],["Wednesday","08:40-09:20"],["Wednesday","09:20-10:00"],["Wednesday","10:20-11:00"],["Wednesday","11:00-11:40"],["Thursday","08:00-08:40"],["Thursday","08:40-09:20"],["Thursday","09:20-10:00"],["Thursday","10:20-11:00"],["Thursday","11:00-11:40"],["Friday","08:00-08:40"],["Friday","08:40-09:20"],["Friday","09:20-10:00"],["Friday","10:20-11:00"],["Friday","11:00-11:40"]];
let out=[],used=new Set(),ti=0;for(let c of classes){for(let s of (subjects[c]||[]).slice(0,5)){let placed=false;for(let k=0;k<slots.length;k++){let [day,time]=slots[(ti+k)%slots.length];let teacher=db.teachers.find(t=>(t.subjects||"").toLowerCase().includes(s.toLowerCase())&&(t.classes||"").toLowerCase().includes(c.toLowerCase()))||db.teachers[0];let key=day+"|"+time+"|"+c,keyt=day+"|"+time+"|T"+teacher.id;if(!used.has(key)&&!used.has(keyt)){out.push({id:uid("TT"),day,time,class:c,subject:s,teacher:teacher.name});used.add(key);used.add(keyt);ti=(ti+k+1)%slots.length;placed=true;break}}if(!placed){} }}db.timetable=out;save();Timetable();toast("Timetable generated")}
function Attendance(){
document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>Attendance</h2></div><div class="formgrid">${field("Class","aclass","Grade 7","select",classes)}${field("Date","adate",new Date().toISOString().slice(0,10),"date")}</div><button onclick="loadAttendance()">Load Learners</button><div id="attout" style="margin-top:15px"></div></div>`}
function loadAttendance(){let c=v("aclass"),d=v("adate"),ls=db.learners.filter(x=>x.class===c);document.getElementById("attout").innerHTML=`<table class="table"><thead><tr><th>Admission</th><th>Learner</th><th>Status</th></tr></thead><tbody>${ls.map(l=>`<tr><td>${esc(l.adm)}</td><td>${esc(l.name)}</td><td><select onchange="setAttendance('${l.id}','${c}','${d}',this.value)"><option>Present</option><option>Absent</option><option>Late</option><option>Excused</option></select></td></tr>`).join("")}</tbody></table>`}
function setAttendance(learner,c,d,status){let i=db.attendance.findIndex(a=>a.learner===learner&&a.date===d);let o={id:i>=0?db.attendance[i].id:uid("A"),learner,class:c,date:d,status};if(i>=0)db.attendance[i]=o;else db.attendance.push(o);save()}
function Reports(){
document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>Individual Learner Report</h2></div><div class="formgrid">${field("Learner","rl","", "select",[""].concat(db.learners.map(l=>l.id)))}${field("Examination","re",db.exams[0]?.id||"","select",db.exams.map(x=>x.id))}<div></div></div><button onclick="showReport()">Generate Report</button><div id="reportout" style="margin-top:15px"></div></div>`}
function showReport(){let l=db.learners.find(x=>x.id===v("rl")),e=v("re");if(!l){toast("Select a learner");return}let ss=subjects[l.class]||[],ms=ss.map(s=>({s,m:db.marks.find(x=>x.learner===l.id&&x.exam===e&&x.subject===s)?.mark})),vals=ms.filter(x=>x.m!==undefined).map(x=>Number(x.m)),avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;let sorted=ms.filter(x=>x.m!==undefined).sort((a,b)=>b.m-a.m);let strengths=sorted.slice(0,2).map(x=>x.s),weak=sorted.slice(-2).map(x=>x.s);let rec=vals.length?`The learner has demonstrated stronger performance in ${strengths.join(" and ")}. More attention should be given to ${weak.join(" and ")} through additional practice, revision, teacher support and regular follow-up.`:"Enter examination marks to generate a personalised recommendation.";let rows=ms.map(x=>`<tr><td>${esc(x.s)}</td><td>${x.m??"—"}</td><td>${x.m===undefined?"—":grade(x.m)}</td><td>${x.m===undefined?"—":subjectPos(l.class,x.s,e,l.id)}</td></tr>`).join("");let pos=overallPos(l.class,e,l.id), total=vals.reduce((a,b)=>a+b,0);document.getElementById("reportout").innerHTML=`<div class="report" id="learnerReport"><div class="schoolhead"><h1>${esc(db.settings.school)}</h1><p>LEARNER PROGRESS REPORT</p><p>${esc(db.settings.term)}, ${db.settings.year}</p></div><div class="reportgrid"><div><b>Name:</b> ${esc(l.name)}</div><div><b>Admission No.:</b> ${esc(l.adm)}</div><div><b>Class:</b> ${esc(l.class)}</div><div><b>Gender:</b> ${esc(l.gender)}</div></div><table><tr><th>Subject</th><th>Marks</th><th>Grade</th><th>Position</th></tr>${rows}</table><div class="reportgrid" style="margin-top:15px"><div><b>Total:</b> ${total}</div><div><b>Average:</b> ${avg.toFixed(2)}</div><div><b>Overall Grade:</b> ${vals.length?grade(avg):"—"}</div><div><b>Overall Position:</b> ${pos||"—"}</div></div><div class="two" style="margin-top:18px"><div class="chartbox"><canvas id="learnerChart"></canvas></div><div class="chartbox"><canvas id="learnerPie"></canvas></div></div><div class="recommend"><b>Recommendation:</b><br>${esc(rec)}</div><p style="margin-top:30px"><b>Class Teacher:</b> ____________________ &nbsp;&nbsp;&nbsp; <b>Headteacher:</b> ____________________</p></div><div class="toolbar no-print"><button onclick="window.print()">Print A4 Report</button></div>`;new Chart(document.getElementById("learnerChart"),{type:"bar",data:{labels:ms.map(x=>x.s),datasets:[{label:"Marks",data:ms.map(x=>x.m||0)}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,max:50}}}});new Chart(document.getElementById("learnerPie"),{type:"pie",data:{labels:ms.map(x=>x.s),datasets:[{data:ms.map(x=>x.m||0)}]},options:{responsive:true,maintainAspectRatio:false}})}
function subjectPos(c,s,e,id){let a=db.marks.filter(m=>m.class===c&&m.subject===s&&m.exam===e).sort((x,y)=>y.mark-x.mark);let i=a.findIndex(x=>x.learner===id);return i<0?"—":i+1}
function overallPos(c,e,id){let ls=db.learners.filter(l=>l.class===c).map(l=>{let a=db.marks.filter(m=>m.learner===l.id&&m.exam===e),avg=a.length?a.reduce((q,x)=>q+x.mark,0)/a.length:0;return{id:l.id,avg}}).filter(x=>x.avg>0).sort((a,b)=>b.avg-a.avg);let i=ls.findIndex(x=>x.id===id);return i<0?"":`${i+1}/${db.learners.filter(l=>l.class===c).length}`}
function Performance(){
let e=db.exams[0]?.id||"", data=classes.map(c=>{let a=db.marks.filter(m=>m.class===c&&m.exam===e);return a.length?a.reduce((s,x)=>s+x.mark,0)/a.length:0});document.getElementById("content").innerHTML=`<div class="card"><div class="section-title"><h2>School Performance</h2></div><div class="chartbox"><canvas id="perfChart"></canvas></div></div><div class="card"><h2>Grade Distribution</h2><div class="tablewrap"><table class="table"><tr><th>Grade</th><th>Count</th></tr>${["EE1","EE2","ME1","ME2","AE1","AE2","BE1","BE2"].map(g=>`<tr><td>${g}</td><td>${db.marks.filter(m=>m.exam===e&&grade(m.mark)===g).length}</td></tr>`).join("")}</table></div></div>`;new Chart(document.getElementById("perfChart"),{type:"bar",data:{labels:classes,datasets:[{label:"Average Marks",data}]},options:{responsive:true,maintainAspectRatio:false,y:{beginAtZero:true}}})}
function Settings(){
document.getElementById("content").innerHTML=`<div class="card"><h2>School Settings</h2><div class="formgrid">${field("School name","school",db.settings.school)}${field("Current term","term",db.settings.term)}${field("Academic year","year",db.settings.year,"number")}${field("Default term fee (KSh)","fee",db.settings.fee,"number")}${field("Phone","phone",db.settings.phone)}${field("Email","email",db.settings.email)}</div><div class="toolbar"><button onclick="saveSettings()">Save Settings</button><button class="danger" onclick="resetData()">Reset All Data</button></div></div><div class="card"><h2>Grading Scale</h2><table class="table"><tr><th>Marks</th><th>Grade</th></tr><tr><td>41–50</td><td>EE1</td></tr><tr><td>36–40</td><td>EE2</td></tr><tr><td>31–35</td><td>ME1</td></tr><tr><td>25–30</td><td>ME2</td></tr><tr><td>21–24.9</td><td>AE1</td></tr><tr><td>15–20</td><td>AE2</td></tr><tr><td>6–14</td><td>BE1</td></tr><tr><td>0–5</td><td>BE2</td></tr></table></div>`}
function saveSettings(){db.settings.school=v("school");db.settings.term=v("term");db.settings.year=v("year");db.settings.fee=Number(v("fee"));db.settings.phone=v("phone");db.settings.email=v("email");save();show("Settings");toast("Settings saved")}
function resetData(){if(confirm("This will erase all locally stored school data. Continue?")){localStorage.removeItem(KEY);location.reload()}}
function v(n){return document.getElementById("f_"+n)?.value||""}
function openModal(html){document.getElementById("modalBody").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kapnanda-school-backup.json";a.click()}
show("Dashboard");
</script>
